id: "how-it-works"
type: "how-it-works"
eyebrow: "Process"
heading: "How it works"
lede: "You direct what you want in plain English. Sibryl handles the layout, code, and production details."
steps:
  - stepNumber: "01"
    title: "Describe the change"
    body: "Tell Sibryl what you want to build or update in plain English. Point to existing brand styles, copy drafts, or layout preferences."
  - stepNumber: "02"
    title: "Review and refine"
    body: "Inspect real working previews immediately. Direct adjustments to spacing, typography, or hierarchy until it feels right."
  - stepNumber: "03"
    title: "Publish"
    body: "Sibryl structures clean code ready to publish while you keep campaign momentum without waiting on developer backlogs."
