id: "how-it-works"
type: "how-it-works"
eyebrow: "Process"
heading: "How it works"
lede: "You direct what you want in plain English. Sibryl handles the layout, code, and asset pipeline."
steps:
  - stepNumber: "1"
    title: "Describe the page or change you need"
    body: "Explain your idea, campaign goals, or new section in direct language. Point to existing brand assets, copy drafts, or layout preferences."
  - stepNumber: "2"
    title: "Review and refine the result visually"
    body: "Inspect real preview builds immediately. Ask for adjustments to spacing, typography, or content hierarchy until it looks right."
  - stepNumber: "3"
    title: "Publish, with Sibryl handling the technical work"
    body: "Sibryl structures clean templates, formats assets, and generates production-ready code while you keep campaign momentum."
