id: "product-example"
type: "product-example"
eyebrow: "Real-world workflow"
heading: "How JENA uses Sibryl"
lede: "JENA provides booking software for solo salon professionals. Here is how their team uses Sibryl to keep their website moving."
workflowSteps:
  - stepNumber: "01"
    title: "Requesting a campaign page"
    description: "JENA wanted to highlight their zero-commission model for solo nail artists. In plain language, the team outlined the offer, target audience, and key comparisons."
  - stepNumber: "02"
    title: "Sibryl matches existing brand patterns"
    description: "Sibryl worked directly with JENA's existing purple and lime brand tokens, typography, and salon photography, generating clean Hugo templates."
  - stepNumber: "03"
    title: "Visual review and fine-tuning"
    description: "The team inspected the live preview, requested tweaks to mobile spacing and copy hierarchy, and approved the final result visually."
  - stepNumber: "04"
    title: "Ready for production"
    description: "The update resulted in clean, maintainable templates ready to publish, with zero engineering bottleneck."
