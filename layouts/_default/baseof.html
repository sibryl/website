<!doctype html>
<html lang="{{ site.Language.LanguageCode | default "en-GB" }}" data-environment="{{ site.Params.environment }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    <a class="skip-link" href="#main-content">
      Skip to main content
    </a>
    {{ partial "header.html" . }}
    <main id="main-content">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
  </body>
</html>
