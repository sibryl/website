{{ define "main" }}
  <article class="page-header">
    <div class="container prose">
      <p class="eyebrow">
        Sibryl
      </p>
      <h1>
        {{ .Title }}
      </h1>
      {{ with .Params.description }}
        <p class="lede">
          {{ . }}
        </p>
      {{ end }}
      {{ with .Params.downloadurl }}
        <p>
          <a class="button button--primary button--lg" href="{{ . }}" data-event="public_cta_selected" data-event-placement="download">Download for macOS</a>
        </p>
      {{ end }}
      {{ .Content }}
    </div>
  </article>
{{ end }}
