{{ define "main" }}

    <div class="container prose">
      <p class="eyebrow">
        Sibryl
      </p>
      <h1>
        {{ .Title }}
      </h1>
      {{ with .Params.description }}

          {{ . }}
        </p>
      {{ end }}
      {{ .Content }}
    </div>
  </article>
{{ end }}
