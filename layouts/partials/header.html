<header class="site-header">
  <div class="container site-header__inner">
    <a class="brand-wordmark" href="{{ if .IsHome }}#top{{ else }}{{ "/" | relURL }}{{ end }}" aria-label="Sibryl home">
      <span class="brand-wordmark__name">Sibryl</span><span class="brand-wordmark__dot">.</span>
    </a>
    {{ with site.Data.site.navigation.primary }}
      <nav class="site-nav" aria-label="Primary navigation">
        <ul class="nav-list">
          {{ range . }}
            <li>
              <a href="{{ .href }}" class="{{ if .isCta }}button button--primary button--sm{{ else }}nav-link{{ end }}">
                {{ .label }}
              </a>
            </li>
          {{ end }}
        </ul>
      </nav>
    {{ end }}
  </div>
</header>
